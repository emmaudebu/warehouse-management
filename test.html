<!DOCTYPE html>
<html>
<head>
<style>
.card {
  background-color: rgba(255, 255, 255, 0.85);
  border: 1px solid rgba(226, 232, 240, 0.9);
  border-radius: 1rem;
  padding: 1.5rem;
  box-shadow: 0 8px 32px 0 rgba(224, 122, 95, 0.08);
}
.form-grid-side-by-side {
  display: flex;
  gap: 2rem;
  width: 100%;
}
.form-grid-side-by-side > * {
  flex: 1 1 50%;
  width: 50%;
}
body { background: #FAF7F2; padding: 2rem; }
</style>
</head>
<body>
  <div class="form-grid-side-by-side">
    <div class="card" style="display: flex; flex-direction: column; gap: 1rem; border-top: 4px solid #E07A5F;">
      <h3>Left Card</h3>
    </div>
    <div class="card" style="display: flex; flex-direction: column; gap: 0.75rem; border: 1px solid rgba(226, 232, 240, 0.9);">
      <h3>Right Card</h3>
    </div>
  </div>
</body>
</html>
